name: MacNotch
options:
  bundleIdPrefix: io.macnotch
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  MediaRemoteAdapter:
    url: https://github.com/ejbills/mediaremote-adapter.git
    revision: 5b6afde3f501a3da567e23bf7f23d562938a1809
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  MacNotch:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: MediaRemoteAdapter
        product: MediaRemoteAdapter
        embed: true
        codeSign: true
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: MacNotch
        CFBundleDisplayName: MacNotch
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026. All rights reserved."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.macnotch.MacNotch
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
